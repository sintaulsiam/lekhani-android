<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lekhani Bengali Keyboard — World-Class UI & Ergonomics Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --surface: #101626;
      --surface-elevated: #182035;
      --key-bg: #1c253d;
      --key-pressed: #2c3859;
      --key-func-bg: #141b2d;
      --key-border: rgba(255, 255, 255, 0.08);
      --key-shadow: rgba(0, 0, 0, 0.45);
      --key-text: #f1f5f9;
      --key-subtext: #8e9bb8;
      --accent: #818cf8;
      --accent-glow: rgba(129, 140, 248, 0.35);
      --candidate-active-bg: #4f46e5;
      --candidate-chip-bg: rgba(255, 255, 255, 0.06);
      --candidate-chip-border: rgba(255, 255, 255, 0.1);
      --radius-key: 9px;
      --font-bn: 'Hind Siliguri', sans-serif;
      --font-en: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--key-text);
      font-family: var(--font-en);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .device-container {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08);
      position: relative;
    }

    /* Top mock chat bar */
    .app-bar {
      padding: 18px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .app-title {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-pill {
      font-size: 11px;
      padding: 3px 8px;
      background: rgba(129, 140, 248, 0.15);
      color: var(--accent);
      border-radius: 12px;
      font-weight: 600;
    }

    /* Mock text input area */
    .text-input-field {
      padding: 18px 20px;
      min-height: 80px;
      font-family: var(--font-bn);
      font-size: 20px;
      line-height: 1.5;
      color: #fff;
      display: flex;
      align-items: flex-start;
      gap: 2px;
    }
    .cursor {
      display: inline-block;
      width: 2px;
      height: 24px;
      background: var(--accent);
      animation: blink 1s infinite;
      margin-left: 2px;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Keyboard Toolbar & Candidate Strip */
    .toolbar-candidate-strip {
      background: var(--surface-elevated);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      border-top: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      scrollbar-width: none;
    }
    .toolbar-candidate-strip::-webkit-scrollbar { display: none; }

    .action-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #94a3b8;
      cursor: pointer;
    }

    /* Material 3 Candidate Chips */
    .candidate-chip {
      font-family: var(--font-bn);
      font-size: 15px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--candidate-chip-bg);
      border: 1px solid var(--candidate-chip-border);
      color: #cbd5e1;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .candidate-chip.active {
      background: var(--candidate-active-bg);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 12px var(--accent-glow);
      font-weight: 600;
    }

    /* Keyboard Canvas Container */
    .keyboard-container {
      padding: 10px 6px 16px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .key-row {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    /* Keycaps with tactile 3D depth */
    .key {
      flex: 1;
      height: 52px;
      background: var(--key-bg);
      border-radius: var(--radius-key);
      border: 1px solid var(--key-border);
      box-shadow: 0 3px 0 var(--key-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.05s ease, background 0.05s ease;
    }
    .key:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--key-shadow);
      background: var(--key-pressed);
    }

    .key.func {
      background: var(--key-func-bg);
      color: #cbd5e1;
    }
    .key.wide-1-4 { flex: 1.4; }
    .key.wide-4-2 { flex: 4.2; }

    .key-main {
      font-family: var(--font-bn);
      font-size: 20px;
      font-weight: 500;
      color: var(--key-text);
      line-height: 1;
    }
    .key-sub {
      position: absolute;
      top: 3px;
      right: 5px;
      font-family: var(--font-bn);
      font-size: 11px;
      color: var(--key-subtext);
      line-height: 1;
    }

    /* Floating elevated thumb preview */
    .key-popup {
      position: absolute;
      width: 58px;
      height: 64px;
      background: #312e81;
      color: #ffffff;
      border-radius: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: var(--font-bn);
      font-size: 28px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.15);
      pointer-events: none;
      z-index: 100;
      transform: translate(-50%, -75px);
    }
    .key-popup::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: #312e81;
      transform: translateX(-50%) rotate(45deg);
      border-bottom-right-radius: 3px;
    }

    /* Layout Switcher Pill Tabs */
    .switcher-bar {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .tab-btn {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255,255,255,0.05);
      color: #94a3b8;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(129, 140, 248, 0.15);
      color: var(--accent);
      border-color: rgba(129, 140, 248, 0.3);
    }
  </style>
</head>
<body>

  <div class="device-container">
    <div class="switcher-bar">
      <button class="tab-btn active" onclick="switchLayout('probaho')">⚡ প্রবাহ (Flow)</button>
      <button class="tab-btn" onclick="switchLayout('english')">English QWERTY</button>
      <button class="tab-btn" onclick="switchLayout('jatiya')">জাতীয় (BBS)</button>
      <button class="tab-btn" onclick="switchLayout('probhat')">Probhat (Mobile 10-Key)</button>
    </div>

    <div class="app-bar">
      <div class="app-title">
        <span>Lekhani Bengali IME</span>
        <span class="badge-pill" id="layoutBadge">প্রবাহ</span>
      </div>
      <div style="font-size: 12px; color: #64748b;">120 FPS Canvas</div>
    </div>

    <div class="text-input-field" id="textField">
      <span id="typedText">আমি বাংলায় </span><span class="cursor"></span>
    </div>

    <!-- Candidate Strip (No Pipes!) -->
    <div class="toolbar-candidate-strip">
      <div class="action-icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </div>
      <div class="candidate-chip active">✓ গান</div>
      <div class="candidate-chip">গাই</div>
      <div class="candidate-chip">কথা</div>
      <div class="candidate-chip">বলি</div>
      <div class="candidate-chip">স্বপ্ন</div>
      <div class="candidate-chip">দেখি</div>
    </div>

    <!-- Keyboard Grid -->
    <div class="keyboard-container" id="kbGrid">
      <!-- Injected dynamically -->
    </div>

    <div class="key-popup" id="keyPopup">ক</div>
  </div>

  <script>
    const layouts = {
      probaho: {
        name: 'প্রবাহ',
        rows: [
          [ {m:'আ', s:'ঔ'}, {m:'ো', s:'ঐ'}, {m:'ী', s:'ঊ'}, {m:'ূ', s:'ঈ'}, {m:'ৈ', s:'ৠ'}, {m:'প', s:'ফ'}, {m:'ব', s:'ভ'}, {m:'ম', s:'গ'}, {m:'দ', s:'ধ'}, {m:'ল', s:'ঘ'} ],
          [ {m:'অ', s:'ঋ'}, {m:'া', s:'ঽ'}, {m:'ি', s:'য়'}, {m:'ু', s:'ৎ'}, {m:'ে', s:'য'}, {m:'র', s:'ড়'}, {m:'ত', s:'থ'}, {m:'ন', s:'ণ'}, {m:'স', s:'শ'}, {m:'ক', s:'খ'} ],
          [ {m:'⇧', func:true, w:'wide-1-4'}, {m:'ৌ', s:'ঞ'}, {m:'ং', s:'ঙ'}, {m:'ঁ', s:'ZWJ'}, {m:'ঃ', s:'ZWNJ'}, {m:'চ', s:'ছ'}, {m:'জ', s:'ঝ'}, {m:'ট', s:'ঠ'}, {m:'ড', s:'ঢ'}, {m:'⌫', func:true, w:'wide-1-4'} ],
          [ {m:'?123', func:true, w:'wide-1-4'}, {m:'🌐', func:true}, {m:',', s:';'}, {m:'স্পেস • প্রবাহ', func:true, w:'wide-4-2'}, {m:'্', s:'হ'}, {m:'।', s:'!'}, {m:'↵', func:true, w:'wide-1-4'} ]
        ]
      },
      english: {
        name: 'English',
        rows: [
          [ {m:'q', s:'1'}, {m:'w', s:'2'}, {m:'e', s:'3'}, {m:'r', s:'4'}, {m:'t', s:'5'}, {m:'y', s:'6'}, {m:'u', s:'7'}, {m:'i', s:'8'}, {m:'o', s:'9'}, {m:'p', s:'0'} ],
          [ {m:'a', s:'A'}, {m:'s', s:'S'}, {m:'d', s:'D'}, {m:'f', s:'F'}, {m:'g', s:'G'}, {m:'h', s:'H'}, {m:'j', s:'J'}, {m:'k', s:'K'}, {m:'l', s:'L'} ],
          [ {m:'⇧', func:true, w:'wide-1-4'}, {m:'z', s:'Z'}, {m:'x', s:'X'}, {m:'c', s:'C'}, {m:'v', s:'V'}, {m:'b', s:'B'}, {m:'n', s:'N'}, {m:'m', s:'M'}, {m:'⌫', func:true, w:'wide-1-4'} ],
          [ {m:'?123', func:true, w:'wide-1-4'}, {m:'🌐', func:true}, {m:',', s:';'}, {m:'Space • English', func:true, w:'wide-4-2'}, {m:'.', s:'?'}, {m:'↵', func:true, w:'wide-1-4'} ]
        ]
      },
      jatiya: {
        name: 'জাতীয়',
        rows: [
          [ {m:'ঙ', s:'ং'}, {m:'য', s:'য়'}, {m:'ড', s:'ঢ'}, {m:'প', s:'ফ'}, {m:'ট', s:'ঠ'}, {m:'চ', s:'ছ'}, {m:'জ', s:'ঝ'}, {m:'হ', s:'ঞ'}, {m:'গ', s:'ঘ'}, {m:'ড়', s:'ঢ়'} ],
          [ {m:'ৃ', s:'ৗ'}, {m:'ু', s:'ূ'}, {m:'ি', s:'ী'}, {m:'ব', s:'ভ'}, {m:'্', s:'।'}, {m:'া', s:'অ'}, {m:'ক', s:'খ'}, {m:'ত', s:'থ'}, {m:'দ', s:'ধ'} ],
          [ {m:'⇧', func:true, w:'wide-1-4'}, {m:'ঁ', s:'ঃ'}, {m:'ো', s:'ৌ'}, {m:'ে', s:'ৈ'}, {m:'র', s:'ল'}, {m:'ন', s:'ণ'}, {m:'স', s:'ষ'}, {m:'ম', s:'শ'}, {m:'⌫', func:true, w:'wide-1-4'} ],
          [ {m:'?123', func:true, w:'wide-1-4'}, {m:'🌐', func:true}, {m:',', s:';'}, {m:'স্পেস • জাতীয়', func:true, w:'wide-4-2'}, {m:'্', s:'ৎ'}, {m:'।', s:'!'}, {m:'↵', func:true, w:'wide-1-4'} ]
        ]
      },
      probhat: {
        name: 'প্রভাত (Mobile 10-Key)',
        rows: [
          [ {m:'দ', s:'ধ'}, {m:'ূ', s:'ঊ'}, {m:'ী', s:'ঈ'}, {m:'র', s:'ড়'}, {m:'ট', s:'ঠ'}, {m:'এ', s:'ঐ'}, {m:'ু', s:'উ'}, {m:'ি', s:'ই'}, {m:'ও', s:'ঔ'}, {m:'প', s:'ফ'} ],
          [ {m:'া', s:'অ'}, {m:'স', s:'ষ'}, {m:'ড', s:'ঢ'}, {m:'ত', s:'থ'}, {m:'গ', s:'ঘ'}, {m:'হ', s:'ঃ'}, {m:'জ', s:'ঝ'}, {m:'ক', s:'খ'}, {m:'ল', s:'ং'} ],
          [ {m:'⇧', func:true, w:'wide-1-4'}, {m:'য়', s:'য'}, {m:'শ', s:'ঢ়'}, {m:'চ', s:'ছ'}, {m:'আ', s:'ঋ'}, {m:'ব', s:'ভ'}, {m:'ন', s:'ণ'}, {m:'ম', s:'ঙ'}, {m:'্', s:'ঁ'}, {m:'⌫', func:true, w:'wide-1-4'} ],
          [ {m:'?123', func:true, w:'wide-1-4'}, {m:'🌐', func:true}, {m:'ে', s:'ৈ'}, {m:'স্পেস • প্রভাত', func:true, w:'wide-4-2'}, {m:'ো', s:'ৌ'}, {m:'।', s:'?'}, {m:'↵', func:true, w:'wide-1-4'} ]
        ]
      }
    };

    let curLayout = 'probaho';
    const grid = document.getElementById('kbGrid');
    const badge = document.getElementById('layoutBadge');
    const popup = document.getElementById('keyPopup');
    const typedText = document.getElementById('typedText');

    function render() {
      const data = layouts[curLayout];
      badge.textContent = data.name;
      grid.innerHTML = '';

      data.rows.forEach((row, rIdx) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'key-row';
        if (rIdx === 1) {
          rowEl.style.paddingLeft = '14px';
          rowEl.style.paddingRight = '14px';
        }

        row.forEach(k => {
          const keyEl = document.createElement('div');
          keyEl.className = 'key' + (k.func ? ' func' : '') + (k.w ? ' ' + k.w : '');

          const main = document.createElement('span');
          main.className = 'key-main';
          main.textContent = k.m;
          keyEl.appendChild(main);

          if (k.s) {
            const sub = document.createElement('span');
            sub.className = 'key-sub';
            sub.textContent = k.s;
            keyEl.appendChild(sub);
          }

          keyEl.onmousedown = (e) => {
            const rect = keyEl.getBoundingClientRect();
            popup.textContent = k.m;
            popup.style.left = (rect.left + rect.width / 2) + 'px';
            popup.style.top = rect.top + 'px';
            popup.style.display = 'flex';

            if (!k.func) {
              typedText.textContent += k.m;
            } else if (k.m === '⌫') {
              typedText.textContent = typedText.textContent.slice(0, -1);
            } else if (k.m.startsWith('স্পেস') || k.m.startsWith('Space')) {
              typedText.textContent += ' ';
            }
          };

          keyEl.onmouseup = () => { popup.style.display = 'none'; };
          keyEl.onmouseleave = () => { popup.style.display = 'none'; };

          rowEl.appendChild(keyEl);
        });
        grid.appendChild(rowEl);
      });
    }

    function switchLayout(type) {
      curLayout = type;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    render();
  </script>
</body>
</html>
