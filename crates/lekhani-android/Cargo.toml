[package]
name = "lekhani-android"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Android UniFFI native bridge crate for Lekhani mobile keyboard"

[lib]
name = "lekhani_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
uniffi = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hashbrown = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
lekhani-parser = { workspace = true }
lekhani-ai = { workspace = true }
lekhani-core = { workspace = true }
lekhani-neural = { workspace = true }

[dev-dependencies]
serial_test = "3"

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
