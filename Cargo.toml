[workspace]
members = [
    "crates/lekhani-android",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Sintaul Mahdi Siam <sintaulsiam@gmail.com>"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/syntenieum/lekhani-android"

[workspace.dependencies]
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hashbrown = "0.14"
tracing = "0.1"
unicode-segmentation = "1.11"
