[workspace]
members = [
    "crates/lekhani-android",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
authors = ["Sintaul Mahdi Siam <sintaulsiam@gmail.com>"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/sintaulsiam/lekhani-android"
homepage = "https://github.com/sintaulsiam/lekhani-android"

[workspace.dependencies]
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hashbrown = { version = "0.14", features = ["serde", "rayon"] }
tracing = "0.1"
unicode-segmentation = "1.11"
rayon = "1.8"
anyhow = "1.0"
memmap2 = "0.9"
edit-distance = "2.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bincode = "1.3"
lekhani-parser = { git = "https://github.com/sintaulsiam/lekhani-engine", tag = "v1.1.0" }
lekhani-ai     = { git = "https://github.com/sintaulsiam/lekhani-engine", tag = "v1.1.0" }
lekhani-core   = { git = "https://github.com/sintaulsiam/lekhani-engine", tag = "v1.1.0" }
lekhani-neural = { git = "https://github.com/sintaulsiam/lekhani-engine", tag = "v1.1.0" }

# ── Local override for simultaneous engine development ───────────────────────
# Uncomment the block below (and comment the git deps above) when you are
# actively editing lekhani-engine at the same time as this repo:
#
[patch."https://github.com/sintaulsiam/lekhani-engine"]
lekhani-parser = { path = "/mnt/data/lekhani-engine/lekhani-parser" }
lekhani-core   = { path = "/mnt/data/lekhani-engine/lekhani-core" }
lekhani-ai     = { path = "/mnt/data/lekhani-engine/lekhani-ai" }
lekhani-neural = { path = "/mnt/data/lekhani-engine/lekhani-neural" }

[profile.dev]
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

