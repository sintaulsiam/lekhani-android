# .cargo/config.toml — Local development overrides
#
# To develop lekhani-engine and lekhani-android simultaneously without
# push/tag cycles, uncomment the [patch] block below. This makes Cargo
# use your local lekhani-engine checkout instead of the GitHub git dep.
#
# Remember to RE-COMMENT before committing — patch overrides should
# never be committed (they contain machine-specific absolute paths).

# [patch."https://github.com/sintaulsiam/lekhani-engine"]
# lekhani-parser = { path = "/mnt/data/lekhani-engine/lekhani-parser" }
# lekhani-core   = { path = "/mnt/data/lekhani-engine/lekhani-core" }
# lekhani-ai     = { path = "/mnt/data/lekhani-engine/lekhani-ai" }
